<template>

    <lightning-card title="Contact" icon-name="custom:custom15">
       <div class="slds-box slds-theme_shade">  
            <lightning-input type="text" name="input1" label="First Name" onchange={handleFirstName} value={firstName}></lightning-input> 
            <lightning-input type="text" name="input1" label="Last Name" onchange={handleLastName} value={lastName}></lightning-input>  
            <lightning-input type = "number" name="input1" label="Phone Number" onchange={handlePhoneNumber} value={phoneNumber}></lightning-input>  
        </div>
            
        <div class="slads-p-around_medium">
            <lightning-button variant="success" label="Save" onclick={handleResult} class="slds-m-left_x-small"></lightning-button>
            <lightning-button variant="destructive" label="Clear" onclick={handleClear} class="slds-m-left_x-small"></lightning-button>
            <lightning-button variant="neutral" label="Close" onclick={close} class="slds-m-left_x-small"></lightning-button>
        </div>

        
    </lightning-card>
     
</template>
