<template>
    <lightning-card title="Interest Calculator" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
                
                <div class="slds-m-around_medium">
                    <lightning-input type="number" label="Priciple Amount" value={pamount} onchange={handlePrincipleChange}></lightning-input>
                    <lightning-input type="number" label="Interest percent" value={ipercent} onchange={handleRateChange}></lightning-input>
                    <lightning-input type="number" label="Number of Years" value={years} onchange={handleTimeChange}></lightning-input>
                </div>
 
                <div class="slds-m-around_medium">
                    <lightning-button variant="brand" label="Calculate" onclick={interest} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button variant="neutral" label="Clear" onclick={handlecancel} class="slds-m-left_x-small"></lightning-button>
                </div>
 
                <div class="slds-p-around_medium">
                    <p>Total Interest :  <span class="slds-text-heading_small">{si}</span></p>
                    <p>Total Amount :  <span class="slds-text-heading_small">{a}</span></p>
                </div>
            
        </div>
    </lightning-card>
</template>
